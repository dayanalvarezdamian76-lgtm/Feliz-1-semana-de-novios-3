<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para mi Lunita ❤️</title>

<style>
body {
  margin: 0;
  background: black;
  color: white;
  font-family: Arial;
  overflow: hidden;
}

.intro {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  color: red;
  animation: introAnim 3s forwards;
}

@keyframes introAnim {
  0% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; }
  100% { opacity: 0; transform: scale(1.2); }
}

.perfiles {
  display: none;
  height: 100vh;
  justify-content: center;
  align-items: center;
  flex-direction: column;
}

.perfil {
  cursor: pointer;
  text-align: center;
  transition: 0.3s;
}

.perfil:hover {
  transform: scale(1.1);
}

.perfil img {
  width: 130px;
  height: 130px;
  object-fit: cover;
  border-radius: 20px;
  border: 3px solid #e50914;
  box-shadow: 0 0 20px #e50914;
}

.universo {
  display: none;
}

h2 {
  position: absolute;
  width: 100%;
  text-align: center;
  top: 35%;
  color: pink;
  text-shadow: 0 0 20px pink;
}

.palabra {
  position: absolute;
  color: #ff99cc;
  animation: flotar linear infinite;
}

@keyframes flotar {
  from { transform: translateY(100vh); }
  to { transform: translateY(-10vh); }
}

.carta {
  position: fixed;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  background: rgba(0,0,0,0.9);
  padding: 20px;
  border-radius: 15px;
  transition: 0.5s;
}

.carta.mostrar {
  transform: translate(-50%, -50%) scale(1);
}

.final {
  position: fixed;
  width: 100%;
  height: 100%;
  display: none;
  align-items: center;
  justify-content: center;
  font-size: 50px;
  color: pink;
  text-shadow: 0 0 20px pink;
}
</style>
</head>

<body>

<div class="intro" id="intro">N</div>

<div class="perfiles" id="perfiles">
  <h1>¿Quién está viendo?</h1>

  <div class="perfil" onclick="entrar()">
    <img src="noelia.jpg">
    <p>Para el amor de mi vida 💖</p>
  </div>
</div>

<div class="universo" id="universo">
  <h2>Noelia, mi Lunita 🌙✨</h2>

  <div class="carta" id="carta">
    <p>
      Mi niña hermosa 💖<br><br>
      Desde que llegaste todo es más bonito.<br>
      Eres mi paz, mi alegría y mi lugar favorito.<br><br>
      Te amo demasiado, mi lunita 🌙✨
    </p>
  </div>
</div>

<div class="final" id="final">
  TE AMO NOELIA 💖
</div>

<audio id="musica" loop>
  <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3">
</audio>

<script>
const texto = "NETFLIX";
let i = 0;
const intro = document.getElementById("intro");

function animarIntro() {
  if (i < texto.length) {
    intro.innerText += texto[i];
    i++;
    setTimeout(animarIntro, 300);
  } else {
    setTimeout(() => {
      intro.style.display = "none";
      document.getElementById("perfiles").style.display = "flex";
    }, 1000);
  }
}

animarIntro();

function entrar() {
  document.getElementById("perfiles").style.display = "none";
  document.getElementById("universo").style.display = "block";
  document.getElementById("musica").play();

  setTimeout(() => {
    document.getElementById("final").style.display = "flex";
  }, 15000);
}

const palabras = [
  "Mi niña hermosa","Mi lunita","Mi vida","Mi todo",
  "Mi princesa","Mi cielo","Mi amorcito","Mi reina",
  "Mi bebé","Mi ternurita","Mi sol","Mi corazón"
];

function crearPalabra() {
  const span = document.createElement("span");
  span.className = "palabra";
  span.innerText = palabras[Math.floor(Math.random()*palabras.length)];

  span.style.left = Math.random()*100 + "vw";
  span.style.fontSize = (Math.random()*20+12) + "px";
  span.style.animationDuration = (Math.random()*5+5)+"s";

  document.body.appendChild(span);

  setTimeout(()=>span.remove(),10000);
}

setInterval(crearPalabra, 300);

document.body.addEventListener("click", () => {
  document.getElementById("carta").classList.add("mostrar");
});
</script>

</body>
</html>
