<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Para Noeli ♡</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: radial-gradient(circle at center, #1a002a, #000000);
  font-family: Arial, sans-serif;
}

/* 🌌 Canvas */
canvas {
  display: block;
}

/* 💖 Texto romántico */
.mensaje {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #ffd6ff;
  font-size: 26px;
  text-align: center;
  text-shadow: 0 0 10px #ff99ff, 0 0 20px #cc66ff;
  animation: fadeIn 3s ease-in-out;
}

/* ✨ Animación texto */
@keyframes fadeIn {
  from { opacity: 0; transform: translate(-50%, -60%); }
  to { opacity: 1; transform: translate(-50%, -50%); }
}
</style>
</head>

<body>

<canvas id="galaxy"></canvas>

<div class="mensaje">
  Para Noeli ♡<br><br>
  Entre millones de estrellas,<br>
  siempre hay una que brilla diferente…<br>
  y para mí, esa eres tú 💜
</div>

<script>
const canvas = document.getElementById("galaxy");
const ctx = canvas.getContext("2d");

/* Ajustar tamaño */
function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize", resize);

/* ⭐ Estrellas */
let stars = [];
for (let i = 0; i < 200; i++) {
  stars.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    size: Math.random() * 2,
    speed: Math.random() * 0.5 + 0.2
  });
}

/* 🌌 Nebulosas */
let nebulas = [];
for (let i = 0; i < 6; i++) {
  nebulas.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    radius: Math.random() * 250 + 100,
    hue: Math.random() * 60 + 280
  });
}

/* Dibujar nebulosa */
function drawNebulas() {
  nebulas.forEach(n => {
    let gradient = ctx.createRadialGradient(n.x, n.y, 0, n.x, n.y, n.radius);
    gradient.addColorStop(0, `hsla(${n.hue}, 100%, 70%, 0.25)`);
    gradient.addColorStop(1, "transparent");

    ctx.fillStyle = gradient;
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.radius, 0, Math.PI * 2);
    ctx.fill();
  });
}

/* Dibujar estrellas */
function drawStars() {
  ctx.fillStyle = "white";

  stars.forEach(star => {
    ctx.beginPath();
    ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
    ctx.fill();

    star.y += star.speed;

    if (star.y > canvas.height) {
      star.y = 0;
      star.x = Math.random() * canvas.width;
    }
  });
}

/* 🌠 Estrella fugaz */
let shootingStars = [];

function createShootingStar() {
  shootingStars.push({
    x: Math.random() * canvas.width,
    y: 0,
    length: Math.random() * 80 + 50,
    speed: Math.random() * 6 + 4
  });
}

setInterval(createShootingStar, 2000);

function drawShootingStars() {
  shootingStars.forEach((s, i) => {
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x - s.length, s.y + s.length);
    ctx.stroke();

    s.x -= s.speed;
    s.y += s.speed;

    if (s.y > canvas.height) {
      shootingStars.splice(i, 1);
    }
  });
}

/* Animación */
function animate() {
  ctx.fillStyle = "rgba(0,0,0,0.2)";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  drawNebulas();
  drawStars();
  drawShootingStars();

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
